  html, body {
    margin: 0;
    padding: 0;
    /* 注意：绝不给 html/body 设 height:100% —— 若文档高度被撑到整屏
       1024 而可视区只有约 910，老 WebKit 会按"可视高÷文档高"整页缩小
       适配（四周留白、内容变小）。容器尺寸全部由 JS 实测后写入。 */
    overflow: hidden;   /* 彻底禁止上下/左右滚动 */
    background: #ffffff;
    color: #000000;
    -webkit-text-size-adjust: 100%;
    text-size-adjust: 100%;
    font-family: "Kindle", "Noto Sans CJK SC", "PingFang SC",
                 "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
  }
  /* 三等分表格布局（PW2 老 WebKit 对 flex 支持不稳，display:table 实测可靠）：
     三行均分整屏高度，每行内 table-cell 垂直+水平居中。
     时间行上下各一条 1px 细分割线。 */
  .wrap  { width: 100%; height: 100%; }
  .box   { display: table; width: 100%; height: 100%; }
  .zone  { display: table-row; }
  .cell  {
    display: table-cell;
    vertical-align: middle;
    text-align: center;
  }
  .zone-time .cell {
    padding: 16px 0;
  }
  /* 格言：居中基础上稍下移；日期农历：居中基础上稍上移。
     改这里的像素值即可微调幅度（如 60px 更明显）。 */
  .zone-top .cell    { padding-top: 40px; }
  .zone-bottom .cell { padding-bottom: 40px; }
  .time-wrap { margin: 0; }

  .motto {
    font-family: inherit;
    font-weight: 600;
    font-size: 50px;
    letter-spacing: 2px;
    /* 让 <input> 版格言看起来与文字无异、可点击编辑 */
    -webkit-appearance: none;
    appearance: none;
    border: 0;
    outline: 0;
    background: transparent;
    padding: 0;
    margin: 0;
    width: auto;
    text-align: center;
    color: inherit;
  }
  .time {
    display: inline-block;
    font-family: "DSEG7", monospace;
    font-weight: normal;
    font-size: 200px;
    line-height: 1.0;
    letter-spacing: 0;
    background: #000000;
    color: #ffffff;
    padding: 34px 14px;
    border-radius: 28px;
  }
  .date {
    font-weight: 600;
    font-size: 50px;
    letter-spacing: 3px;
  }
  .lunar {
    font-weight: 600;
    font-size: 50px;
    margin-top: 22px;
    letter-spacing: 3px;
  }
  /* 窄屏（部分固件 viewport 小于 758）兜底，避免溢出 */
  @media (max-width: 600px) {
    .motto { font-size: 36px; }
    .time  { font-size: 150px; padding: 8px 20px; border-radius: 20px; }
    .date  { font-size: 51px; }
    .lunar { font-size: 47px; }
  }

  /* ===================== 横屏（伪横屏） =====================
     整页逆时针旋转 90° 显示：纯 CSS transform，不依赖设备横屏能力。
     点页面任意空白处切换。横屏下：时间在上方主区居中最大化，
     底部信息带（日期+农历在上、格言在下）整宽单行显示，不换行。 */
  body.landscape #wrap {
    /* 不用 top:50%+translate 居中：PW2 老 WebKit 下布局盒会溢出视口，
       触发"整页缩小适配"（内容变小挤在一角）。
       改为锚定左上角、仅旋转，垂直居中由 JS 按可视高度算 top。 */
    position: fixed;
    top: 0;
    left: 0;
    -webkit-transform: rotate(-90deg);
    transform: rotate(-90deg);
    -webkit-transform-origin: 50% 50%;
    transform-origin: 50% 50%;
  }
  body.landscape .box {
    display: block;
    position: absolute;
    top: 0; left: 0;
    width: 100%; height: 100%;
  }
  body.landscape .zone { display: block; position: absolute; }
  /* 底部信息带（画布底部一段；旋转后在屏幕下方）：
     平均分成左右两半——左=日期+农历，右=格言，中间一条竖分割线 */
  body.landscape .zone-top,
  body.landscape .zone-bottom {
    display: table;
    top: 554px; height: 200px;
    text-align: center;
  }
  body.landscape .zone-bottom { left: 0;   width: 50%; }   /* 左：日期 + 农历（严格平分） */
  body.landscape .zone-top    { left: 50%; width: 50%; }   /* 右：格言（严格平分） */
  body.landscape .zone-top > .cell,
  body.landscape .zone-bottom > .cell {
    display: table-cell;
    vertical-align: middle;
    text-align: center;
    width: 100%; height: 100%;
    padding: 0;
  }
  /* 与竖分割线的距离左右一致：左栏文字右对齐、右栏文字左对齐（镜像对称），
     间距均为 16px，与文字宽度无关，恒定相等。
     想调这个距离：改下面两处 padding 的 16px（保持两边相等） */
  body.landscape .zone-bottom > .cell { text-align: right; padding-right: 16px; }
  body.landscape .zone-top    > .cell { text-align: left;  padding-left: 16px; }
  /* 左右半之间的细分割线（画布里是左半的右缘竖线，旋转后在屏幕里为竖直线）
     bottom: 24px —— 底端不顶到屏幕边，留出空隙 */
  body.landscape .zone-bottom::after {
    content: "";
    position: absolute;
    top: 0; bottom: 24px; right: 0;
    width: 2px;
    background: #000000;
  }
  /* 主区（屏幕上方）：时间竖直居中。
     必须写显式 height（754-554）：老 WebKit 对 top/bottom 推导的隐式高度
     不解析 cell 的 height:100%，导致 vertical-align:middle 失效；
     信息带（显式 height:200px）居中一直正常，用同一套已验证模式 */
  body.landscape .zone-time {
    top: 0; left: 0; right: 0;
    height: 554px;               /* 与分割线（top:554px）对齐，改分割线位置时同步改 */
    display: table; width: 100%;
    position: absolute;
    overflow: hidden;            /* 裁剪任何微小溢出，杜绝滚动条 */
  }
  body.landscape .zone-time > .cell {
    display: table-cell;
    vertical-align: middle;
    text-align: center;
    height: 100%;
    padding: 0;
  }
  /* 时间块：font-size 只是基准，JS（fitTime）会实测宽度后
     自动放大/缩小到刚好占满可用宽（左右不留空隙），绝不裁切。
     padding 是黑块内边距：上下 18 / 左右 0。
     不竖向拉伸：保持七段数字原始高宽比，在主区内自然竖直居中。 */
  body.landscape .time {
    font-size: 260px;
    padding: 18px 0px;
  }
  /* 横屏信息字号：基础 32px（放大后与 200px 信息带更协调）。
     左右两栏各约 379px；实际渲染时 JS（fitInfo）实测宽度，
     超栏宽自动微缩，绝不换行（格言 12 字 ≈384px，会自动缩到 ~31px） */
  body.landscape .date,
  body.landscape .lunar,
  body.landscape .motto {
    font-size: 32px;
    letter-spacing: 1px;
    white-space: nowrap;
  }
  body.landscape .motto { letter-spacing: 0; }   /* 取消字距，32px 仍能单行放下 */
  body.landscape .lunar { margin-top: 10px; }
  /* 时间与信息带之间的细分割线（画布里是水平线，旋转后在屏幕里为竖直线） */
  body.landscape .box::after {
    content: "";
    position: absolute;
    top: 554px; left: 0; right: 0;
    height: 2px;
    background: #000000;
    z-index: 5;
  }
</style>

function lYearDays(y){var i,sum=348;for(i=0x8000;i>0x8;i>>=1){sum+=(lunarInfo[y-1900]&i)?1:0;}return sum+leapDays(y);}
function leapDays(y){if(leapMonth(y)){return((lunarInfo[y-1900]&0x10000)?30:29);}return 0;}
function leapMonth(y){return(lunarInfo[y-1900]&0xf);}
function monthDays(y,m){if(m>12||m<1)return -1;return((lunarInfo[y-1900]&(0x10000>>m))?30:29);}

function solar2lunar(yy,mm,dd){
  var objDate=new Date(yy,mm-1,dd);
  var baseDate=new Date(1900,0,31);
  var offset=Math.round((objDate-baseDate)/86400000);
  var i,temp=0;
  for(i=1900;i<2101&&offset>0;i++){temp=lYearDays(i);offset-=temp;}
  if(offset<0){offset+=temp;i--;}
  var year=i;
  var leap=leapMonth(i);
  var isLeap=false;
  var month;
  for(month=1;month<13&&offset>0;month++){
    if(leap>0&&month===(leap+1)&&!isLeap){--month;isLeap=true;temp=leapDays(year);}
    else{temp=monthDays(year,month);}
    if(isLeap&&month===(leap+1)){isLeap=false;}
    offset-=temp;
  }
  if(offset===0&&leap>0&&month===leap+1){
    if(isLeap){isLeap=false;}else{isLeap=true;--month;}
  }
  if(offset<0){offset+=temp;--month;}
  return{year:year,month:month,day:offset+1,isLeap:isLeap};
}

var GAN  = ["甲","乙","丙","丁","戊","己","庚","辛","壬","癸"];

var ANIMALS = ["鼠","牛","虎","兔","龙","蛇","马","羊","猴","鸡","狗","猪"];
var MONTH_CN = ["正","二","三","四","五","六","七","八","九","十","冬","腊"];
var WEEK_CN  = ["星期日","星期一","星期二","星期三","星期四","星期五","星期六"];
var DIGIT_CN = ["〇","一","二","三","四","五","六","七","八","九"];

function ganzhiOf(y){var i=((y-4)%12+12)%12;return GAN[((y-4)%10+10)%10]+ZHI[i];}
function zodiacOf(y){return ANIMALS[((y-4)%12+12)%12];}

function yearToCN(y){
  var s=String(y), out="";
  for(var k=0;k<s.length;k++){ out+=DIGIT_CN[parseInt(s.charAt(k),10)]; }
  return out+"年";
}
function monthToCN(m,isLeap){
  var base = isLeap ? "闰"+MONTH_CN[m-1] : MONTH_CN[m-1];
  return base+"月";
}
function dayToCN(d){
  if(d===10) return "初十";
  if(d===20) return "二十";
  if(d===30) return "三十";
  var n=["日","一","二","三","四","五","六","七","八","九"];
  var t=Math.floor(d/10), u=d%10;
  if(t===0) return "初"+n[u];
  if(t===1) return "十"+n[u];
  if(t===2) return "廿"+n[u];
  return "";
}

/* ===================== 渲染 ===================== */
var elTime  = document.getElementById("time");
var elDate  = document.getElementById("date");
var elLunar = document.getElementById("lunar");

var lastTime="", lastDate="", lastLunar="";

function pad(n){ return n<10 ? "0"+n : ""+n; }

/* 时区修正：Kindle 实验性浏览器的 JS 时间常按 UTC 处理，
   而用户位于 UTC+8（北京时），导致少算 8 小时。
   设备内部绝对时间(epoch)其实是对的，只是时区标签问题。
   这里直接按绝对时间 +8 小时换算为北京时间，无论设备时区如何设置都正确。 */
var TARGET_TZ = 8;   // 目标时区（小时），中国为 +8；去国外改这里即可

function getLocalNow(){
  var d = new Date();
  return new Date(d.getTime() + TARGET_TZ * 3600 * 1000);
}

function render(){
  var now = getLocalNow();
  var hh = pad(now.getUTCHours());
  var mm = pad(now.getUTCMinutes());
  var timeStr = hh+":"+mm;

  var dateStr = now.getUTCFullYear()+"年"+(now.getUTCMonth()+1)+"月"+now.getUTCDate()+"日 "
             + WEEK_CN[now.getUTCDay()];

  var L = solar2lunar(now.getUTCFullYear(), now.getUTCMonth()+1, now.getUTCDate());
  var lunarStr = ganzhiOf(L.year) + "（" + zodiacOf(L.year) + "）年 "
              + monthToCN(L.month, L.isLeap) + dayToCN(L.day);

  // 只在内容变化时写 DOM，把墨水屏重绘压到最低（每分钟一次时间刷新）
  if(timeStr  !== lastTime)  { elTime.textContent  = timeStr;  lastTime  = timeStr;  }
  if(dateStr  !== lastDate)  { elDate.textContent  = dateStr;  lastDate  = dateStr;  }
  if(lunarStr !== lastLunar) { elLunar.textContent = lunarStr; lastLunar = lunarStr; }
}

/* ===================== 锁屏 / 休眠处理 =====================
   说明：stock Kindle Paperwhite 2 的实验性浏览器不暴露任何
   "禁止休眠" 的系统 API，纯网页无法真正阻止设备睡眠/锁屏。
   这里做的是两件事：
   1) Wake Lock —— 现代浏览器/设备可借此保持屏幕常亮；PW2 老浏览器
      会静默失败，无副作用（不影响时钟运行）。
   2) 唤醒校正 —— 设备从锁屏/休眠被点亮时，立刻把时间刷新成当前
      正确值，避免停在睡前那一刻。这是 PW2 上真正起作用的部分。
*/

var wakeLock = null;
function requestWakeLock(){
  try {
    if ('wakeLock' in navigator) {
      navigator.wakeLock.request('screen')
        .then(function(l){ wakeLock = l; })
        .catch(function(){});   // 失败（如 PW2 不支持）静默忽略
    }
  } catch (e) { /* 老浏览器直接抛错也忽略 */ }
}

// 设备被点亮/回到前台：立刻校正时间 + 重新申请唤醒锁 + 重测视口
function onWake(){
  applyViewport();
  render();
  requestWakeLock();
}
document.addEventListener('visibilitychange', function(){
  if (!document.hidden) onWake();
});
window.addEventListener('pageshow', onWake);   // 从缓存/锁屏恢复
window.addEventListener('focus', onWake);

/* ===================== 首屏铺满修复 =====================
   Kindle Paperwhite 2 的实验性浏览器首屏把布局视口判定成错值，
   连 window.innerWidth/innerHeight 在首屏也是错的，要等约一分钟后
   一次全屏刷新才正确。所以这里不再读窗口尺寸，直接把容器按本机
   真实分辨率（Paperwhite 2 = 758×1024）设成固定像素，首屏即铺满。
   换设备时改下面的 DEV_W / DEV_H 即可。 */
var elWrap = document.getElementById('wrap');
var elTime = document.getElementById('time');
var elMotto = document.getElementById('motto');
var landscape = false;           // 横屏开关：点击页面任意处切换

/* ===================== 格言可编辑 + 本地持久化 =====================
   把格言做成 <input>：点一下弹出虚拟键盘即可改字；改动后存到
   localStorage（本机保存，不依赖 WiFi，下次打开自动沿用）。
   点输入框时不触发横竖屏切换（阻止冒泡到 document 的 click）。 */
(function initMotto(){
  try {
    var saved = localStorage.getItem('kindle_clock_motto');
    if (saved !== null) elMotto.value = saved;
  } catch (e) {}                   // 隐私模式/不支持 localStorage 时忽略
  function applyMottoSize(){
    elMotto.setAttribute('size', Math.max(4, elMotto.value.length));
  }
  function saveMotto(){
    applyMottoSize();
    try { localStorage.setItem('kindle_clock_motto', elMotto.value); } catch (e) {}
    fitInfo();
  }
  applyMottoSize();
  elMotto.addEventListener('input', saveMotto);
  elMotto.addEventListener('blur',  saveMotto);
  elMotto.addEventListener('click', function(e){ e.stopPropagation(); });
})();

// 兜底常量：PW2 硬件 758×1024；实机实测浏览器可视区 758×897（工具栏已由浏览器扣除）
var DEV_W = 758, FB_H = 897;
var TIME_FONT = 260;             // ← 横屏时间数字大小基准（px），fitTime 会在此基础上
                                 //    自动放大/缩小到刚好占满可用宽
var TIME_SCALE_Y = 1.0;          // ← 时间竖向拉伸倍数（1=不拉伸，保持原始比例）。与 CSS 里是否有 scaleY 保持一致
var TIME_ZONE_H = 554;           // ← 横屏时间主区高度（与 CSS 的 zone-time height 一致）

/* ===================== 视口尺寸 =====================
   容器尺寸全部用确定性常量（PW2 实测可视区 758×897），
   不读实时测量值：点切换时地址栏闪烁会让 clientHeight 在
   897(工具栏显示)/1024(隐藏) 间跳动，容器尺寸与可视区错位会冒滚动条。 */
/* 横屏时间块适配：先按基准字号 TIME_FONT 渲染并实测布局宽 offsetWidth，
   然后按比例把 font-size 换算到「刚好占满可用宽」——超宽会缩、不足会放大
   （宽度与字号成正比，一次换算即可），左右不留空隙。
   同时受高度上限约束：字号 × 竖向拉伸后不得超过主区高度，防止压到分割线。 */
function fitTime(){
  if (!elTime) return;
  if (!landscape || !elWrap){ elTime.style.fontSize = ''; return; }
  var avail = elWrap.clientWidth - 2;      // ← 左右共留 2px 安全边（画布本身已比视口窄 2px）
  elTime.style.fontSize = TIME_FONT + 'px';
  var w = elTime.offsetWidth;
  if (w > 0){
    var fs = Math.floor(TIME_FONT * avail / w);
    // 高度上限：黑块高 ≈ 字号 + 36(padding)，乘拉伸倍数后要留在主区内（再留 8px 余量）
    var maxFs = Math.floor(TIME_ZONE_H / TIME_SCALE_Y) - 36 - 8;
    if (fs > maxFs) fs = maxFs;
    elTime.style.fontSize = fs + 'px';
    // 二次校正：取整误差可能仍超 1~2px，逐 px 回缩直到不超
    w = elTime.offsetWidth;
    while (w > avail && fs > 10){
      fs--;
      elTime.style.fontSize = fs + 'px';
      w = elTime.offsetWidth;
    }
  }
}
/* 横屏信息带适配：日期/农历/格言按基准字号（CSS 32px）渲染后实测宽度，
   超出所在栏宽就自动缩字号到刚好放下 —— 放大字号也绝不换行。
   农历比日期短，跟随日期字号即可；竖屏恢复 CSS 默认字号。 */
function fitInfo(){
  if (!landscape){ 
    if (elDate)  elDate.style.fontSize  = '';
    if (elLunar) elLunar.style.fontSize = '';
    if (elMotto) elMotto.style.fontSize = '';
    return;
  }
  var base = 32;                            // ← 与 CSS 里 body.landscape 的信息字号保持一致
  // 左栏：日期 + 农历（cell 有 16px 右内边距贴分割线，留 4px 安全边）
  var cellL = elDate.parentNode;
  var availL = cellL.clientWidth - 20;      // 16 内边距 + 4 安全边
  elDate.style.fontSize = base + 'px';
  elLunar.style.fontSize = base + 'px';
  var wL = elDate.offsetWidth;
  if (wL > availL && wL > 0 && availL > 0){
    var fsL = Math.floor(base * availL / wL) + 'px';
    elDate.style.fontSize  = fsL;
    elLunar.style.fontSize = fsL;
  }
  // 右栏：格言（cell 有 16px 左内边距贴分割线，留 4px 安全边）
  var cellR = elMotto.parentNode;
  var availR = cellR.clientWidth - 20;      // 16 内边距 + 4 安全边
  elMotto.style.fontSize = base + 'px';
  var wR = elMotto.offsetWidth;
  if (wR > availR && wR > 0 && availR > 0){
    elMotto.style.fontSize = Math.floor(base * availR / wR) + 'px';
  }
}
function applyViewport(){
  if (!elWrap) return;
  // 容器尺寸全部用确定性常量，不读实时测量值 —— 否则点切换时地址栏闪烁，
  // clientHeight 在 897(工具栏显示)/1024(隐藏) 间跳动，容器尺寸与可视区错位，
  // 老 WebKit 把 fixed 当 absolute 处理，冒出滚动条。
  // FB_H=897 同时 ≤ 工具栏显示态(897) 与隐藏态(1024)：工具栏怎么闪都不溢出。
  var hEff = FB_H, top = 0;
  elWrap.style.position = 'fixed';
  elWrap.style.left = '0px';
  elWrap.style.right = '0px';
  elWrap.style.overflow = 'hidden';   // 容器内部裁剪，杜绝任何横向溢出滚动条
  if (landscape){
    // 横屏：正方形画布边长 756（≤ 屏幕宽 758，旋转后水平/竖直都不溢出），
    // 在 897 高可视区内垂直居中。
    var side = Math.min(DEV_W, FB_H) - 2;   // 756（仍 < 视口 758，不触发滚动条）
    elWrap.style.width  = side + 'px';
    elWrap.style.height = side + 'px';
    elWrap.style.top    = Math.floor((hEff - side) / 2) + 'px';
  } else {
    // 竖屏：宽高固定 758×897（< 视口，恒不溢出）。切回竖屏时也不会残留横屏尺寸。
    elWrap.style.width  = DEV_W + 'px';
    elWrap.style.height = hEff + 'px';
    elWrap.style.top    = top + 'px';
  }
  fitTime();
  fitInfo();
  // 强制重排，提示老 WebKit 重新计算布局
  try { window.scrollTo(0, 0); } catch(e){}
}
// 点击「时间区域」：竖屏 <-> 横屏 切换。
// 监听只挂在 .zone-time 上，点日期/格言/其它空白处不触发。
function toggleMode(){
  landscape = !landscape;
  document.body.classList.toggle('landscape', landscape);
  applyViewport();
}
var elTimeZone = document.querySelector('.zone-time');
if (elTimeZone) elTimeZone.addEventListener('click', toggleMode);
window.addEventListener('resize', applyViewport);
// 加载后分多次重测（覆盖首屏视口滞后的窗口，实测值变了对齐也跟着变）
function bootFix(){ applyViewport(); }
bootFix();
setTimeout(bootFix, 300);
setTimeout(bootFix, 1000);
setTimeout(bootFix, 3000);
setTimeout(bootFix, 6000);

render();
applyViewport();
requestWakeLock();
/* ===================== 省电刷新（对齐到下一分钟） =====================
   显示精度只到分钟（HH:MM），无需每秒刷新。旧版用 setInterval(…,1000)
   每秒唤醒一次 CPU，墨水屏待机下空转耗电，Kindle 掉电快。
   改为"对齐到下一分钟整点"的单次 setTimeout：每分钟最多唤醒一次，
   屏幕也只在分钟变化时重绘一次，其余时间 SoC 可深度休眠。
   设备从锁屏/休眠被点亮时由 onWake() 立即校正，不依赖这个计时器。 */
function scheduleNextTick(){
  var d = new Date();
  var delay = (60 - d.getSeconds()) * 1000 - d.getMilliseconds() + 50;  // 距下一分钟 + 50ms 缓冲
  if (delay < 50) delay = 50;
  setTimeout(function(){
    render();
    scheduleNextTick();
  }, delay);
}
scheduleNextTick();
</script>
</body>
</html>
