<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Kindle 时钟</title>
<style>
  html, body {
    margin: 0;
    padding: 0;
    height: 100%;
    background: #ffffff;
    color: #000000;
    -webkit-text-size-adjust: 100%;
    text-size-adjust: 100%;
    font-family: "Kindle", "Noto Sans CJK SC", "PingFang SC",
                 "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
  }
  /* 纵向分布：格言靠上、时间居中、日期农历靠下，减少上下留白。
     同时写 -webkit-box（老版 WebKit）与 flex（现代浏览器）双兼容。 */
  .wrap  { width: 100%; height: 100%; }
  .box {
    display: -webkit-box;
    display: flex;
    -webkit-box-orient: vertical;
    flex-direction: column;
    -webkit-box-pack: justify;
    justify-content: space-between;
    -webkit-box-align: center;
    align-items: center;
    height: 100%;
    box-sizing: border-box;
    padding: 26px 0;
    text-align: center;
  }

  .motto {
    width: 80%;
    margin: 0 auto;
    font-weight: 600;
    font-size: 55px;
    letter-spacing: 3px;
    padding-bottom: 22px;
    border-bottom: 2px solid #000;
  }
  .time {
    width: 80%;
    margin: 0 auto;
    font-weight: 700;
    font-size: 270px;
    line-height: 1.0;
    letter-spacing: 6px;
    padding-bottom: 18px;
    border-bottom: 2px solid #000;
  }
  .bottom { }
  .date {
    font-weight: 600;
    font-size: 55px;
    margin-top: 0;
    letter-spacing: 3px;
  }
  .lunar {
    font-weight: 600;
    font-size: 55px;
    margin-top: 22px;
    letter-spacing: 3px;
  }
  /* 窄屏（部分固件 viewport 小于 758）兜底，避免溢出 */
  @media (max-width: 600px) {
    .motto { font-size: 40px; padding-bottom: 16px; }
    .time  { font-size: 195px; padding-bottom: 12px; }
    .date  { font-size: 51px; }
    .lunar { font-size: 47px; }
  }
</style>
</head>
<body>
  <div class="wrap">
    <div class="box">
      <div class="motto">临渊羡鱼，不如退而结网。</div>
      <div class="time"  id="time">--:--</div>
      <div class="bottom">
        <div class="date"  id="date">----年--月--日 星期-</div>
        <div class="lunar" id="lunar">农历 ----</div>
      </div>
    </div>
  </div>

<script>
/* ===================== 农历 / 生肖 换算（1900–2100，离线内置） ===================== */
var lunarInfo = [
0x04bd8,0x04ae0,0x0a570,0x054d5,0x0d260,0x0d950,0x16554,0x056a0,0x09ad0,0x055d2,
0x04ae0,0x0a5b6,0x0a4d0,0x0d250,0x1d255,0x0b540,0x0d6a0,0x0ada2,0x095b0,0x14977,
0x04970,0x0a4b0,0x0b4b5,0x06a50,0x06d40,0x1ab54,0x02b60,0x09570,0x052f2,0x04970,
0x06566,0x0d4a0,0x0ea50,0x06e95,0x05ad0,0x02b60,0x186e3,0x092e0,0x1c8d7,0x0c950,
0x0d4a0,0x1d8a6,0x0b550,0x056a0,0x1a5b4,0x025d0,0x092d0,0x0d2b2,0x0a950,0x0b557,
0x06ca0,0x0b550,0x15355,0x04da0,0x0a5b0,0x14573,0x052b0,0x0a9a8,0x0e950,0x06aa0,
0x0aea6,0x0ab50,0x04b60,0x0aae4,0x0a570,0x05260,0x0f263,0x0d950,0x05b57,0x056a0,
0x096d0,0x04dd5,0x04ad0,0x0a4d0,0x0d4d4,0x0d250,0x0d558,0x0b540,0x0b6a0,0x195a6,
0x095b0,0x049b0,0x0a974,0x0a4b0,0x0b27a,0x06a50,0x06d40,0x0af46,0x0ab60,0x09570,
0x04af5,0x04970,0x064b0,0x074a3,0x0ea50,0x06b58,0x055c0,0x0ab60,0x096d5,0x092e0,
0x0c960,0x0d954,0x0d4a0,0x0da50,0x07552,0x056a0,0x0abb7,0x025d0,0x092d0,0x0cab5,
0x0a950,0x0b4a0,0x0baa4,0x0ad50,0x055d9,0x04ba0,0x0a5b0,0x15176,0x052b0,0x0a930,
0x07954,0x06aa0,0x0ad50,0x05b52,0x04b60,0x0a6e6,0x0a4e0,0x0d260,0x0ea65,0x0d530,
0x05aa0,0x076a3,0x096d0,0x04afb,0x04ad0,0x0a4d0,0x1d0b6,0x0d250,0x0d520,0x0dd45,
0x0b5a0,0x056d0,0x055b2,0x049b0,0x0a577,0x0a4b0,0x0aa50,0x1b255,0x06d20,0x0ada0,
0x14b63,0x09370,0x049f8,0x04970,0x064b0,0x168a6,0x0ea50,0x06b20,0x1a6c4,0x0aae0,
0x0a2e0,0x0d2e3,0x0c960,0x0d557,0x0d4a0,0x0da50,0x05d55,0x056a0,0x0a6d0,0x055d4,
0x052d0,0x0a9b8,0x0a950,0x0b4a0,0x0b6a6,0x0ad50,0x055a0,0x0aba4,0x0a5b0,0x052b0,
0x0b273,0x06930,0x07337,0x06aa0,0x0ad50,0x14b55,0x04b60,0x0a570,0x054e4,0x0d160,
0x0e968,0x0d520,0x0daa0,0x16aa6,0x056d0,0x04ae0,0x0a9d4,0x0a2d0,0x0d150,0x0f252,
0x0d520
];

function lYearDays(y){var i,sum=348;for(i=0x8000;i>0x8;i>>=1){sum+=(lunarInfo[y-1900]&i)?1:0;}return sum+leapDays(y);}
function leapDays(y){if(leapMonth(y)){return((lunarInfo[y-1900]&0x10000)?30:29);}return 0;}
function leapMonth(y){return(lunarInfo[y-1900]&0xf);}
function monthDays(y,m){if(m>12||m<1)return -1;return((lunarInfo[y-1900]&(0x10000>>m))?30:29);}

function solar2lunar(yy,mm,dd){
  var objDate=new Date(yy,mm-1,dd);
  var baseDate=new Date(1900,0,31);
  var offset=Math.round((objDate-baseDate)/86400000);
  var i,temp=0;
  for(i=1900;i<2101&&offset>0;i++){temp=lYearDays(i);offset-=temp;}
  if(offset<0){offset+=temp;i--;}
  var year=i;
  var leap=leapMonth(i);
  var isLeap=false;
  var month;
  for(month=1;month<13&&offset>0;month++){
    if(leap>0&&month===(leap+1)&&!isLeap){--month;isLeap=true;temp=leapDays(year);}
    else{temp=monthDays(year,month);}
    if(isLeap&&month===(leap+1)){isLeap=false;}
    offset-=temp;
  }
  if(offset===0&&leap>0&&month===leap+1){
    if(isLeap){isLeap=false;}else{isLeap=true;--month;}
  }
  if(offset<0){offset+=temp;--month;}
  return{year:year,month:month,day:offset+1,isLeap:isLeap};
}

var GAN  = ["甲","乙","丙","丁","戊","己","庚","辛","壬","癸"];
var ZHI  = ["子","丑","寅","卯","辰","巳","午","未","申","酉","戌","亥"];
var ANIMALS = ["鼠","牛","虎","兔","龙","蛇","马","羊","猴","鸡","狗","猪"];
var MONTH_CN = ["正","二","三","四","五","六","七","八","九","十","冬","腊"];
var WEEK_CN  = ["星期日","星期一","星期二","星期三","星期四","星期五","星期六"];
var DIGIT_CN = ["〇","一","二","三","四","五","六","七","八","九"];

function ganzhiOf(y){var i=((y-4)%12+12)%12;return GAN[((y-4)%10+10)%10]+ZHI[i];}
function zodiacOf(y){return ANIMALS[((y-4)%12+12)%12];}

function yearToCN(y){
  var s=String(y), out="";
  for(var k=0;k<s.length;k++){ out+=DIGIT_CN[parseInt(s.charAt(k),10)]; }
  return out+"年";
}
function monthToCN(m,isLeap){
  var base = isLeap ? "闰"+MONTH_CN[m-1] : MONTH_CN[m-1];
  return base+"月";
}
function dayToCN(d){
  if(d===10) return "初十";
  if(d===20) return "二十";
  if(d===30) return "三十";
  var n=["日","一","二","三","四","五","六","七","八","九"];
  var t=Math.floor(d/10), u=d%10;
  if(t===0) return "初"+n[u];
  if(t===1) return "十"+n[u];
  if(t===2) return "廿"+n[u];
  return "";
}

/* ===================== 渲染 ===================== */
var elTime  = document.getElementById("time");
var elDate  = document.getElementById("date");
var elLunar = document.getElementById("lunar");

var lastTime="", lastDate="", lastLunar="";

function pad(n){ return n<10 ? "0"+n : ""+n; }

/* 时区修正：Kindle 实验性浏览器的 JS 时间常按 UTC 处理，
   而用户位于 UTC+8（北京时），导致少算 8 小时。
   设备内部绝对时间(epoch)其实是对的，只是时区标签问题。
   这里直接按绝对时间 +8 小时换算为北京时间，无论设备时区如何设置都正确。 */
var TARGET_TZ = 8;   // 目标时区（小时），中国为 +8；去国外改这里即可

function getLocalNow(){
  var d = new Date();
  return new Date(d.getTime() + TARGET_TZ * 3600 * 1000);
}

function render(){
  var now = getLocalNow();
  var hh = pad(now.getUTCHours());
  var mm = pad(now.getUTCMinutes());
  var timeStr = hh+":"+mm;

  var dateStr = now.getUTCFullYear()+"年"+(now.getUTCMonth()+1)+"月"+now.getUTCDate()+"日 "
             + WEEK_CN[now.getUTCDay()];

  var L = solar2lunar(now.getUTCFullYear(), now.getUTCMonth()+1, now.getUTCDate());
  var lunarStr = "农历 " + ganzhiOf(L.year) + "（" + zodiacOf(L.year) + "）年 "
              + monthToCN(L.month, L.isLeap) + dayToCN(L.day);

  // 只在内容变化时写 DOM，把墨水屏重绘压到最低（每分钟一次时间刷新）
  if(timeStr  !== lastTime)  { elTime.textContent  = timeStr;  lastTime  = timeStr;  }
  if(dateStr  !== lastDate)  { elDate.textContent  = dateStr;  lastDate  = dateStr;  }
  if(lunarStr !== lastLunar) { elLunar.textContent = lunarStr; lastLunar = lunarStr; }
}

/* ===================== 锁屏 / 休眠处理 =====================
   说明：stock Kindle Paperwhite 2 的实验性浏览器不暴露任何
   "禁止休眠" 的系统 API，纯网页无法真正阻止设备睡眠/锁屏。
   这里做的是两件事：
   1) Wake Lock —— 现代浏览器/设备可借此保持屏幕常亮；PW2 老浏览器
      会静默失败，无副作用（不影响时钟运行）。
   2) 唤醒校正 —— 设备从锁屏/休眠被点亮时，立刻把时间刷新成当前
      正确值，避免停在睡前那一刻。这是 PW2 上真正起作用的部分。
*/

var wakeLock = null;
function requestWakeLock(){
  try {
    if ('wakeLock' in navigator) {
      navigator.wakeLock.request('screen')
        .then(function(l){ wakeLock = l; })
        .catch(function(){});   // 失败（如 PW2 不支持）静默忽略
    }
  } catch (e) { /* 老浏览器直接抛错也忽略 */ }
}

// 设备被点亮/回到前台：立刻校正时间 + 重新申请唤醒锁
function onWake(){
  render();
  requestWakeLock();
}
document.addEventListener('visibilitychange', function(){
  if (!document.hidden) onWake();
});
window.addEventListener('pageshow', onWake);   // 从缓存/锁屏恢复
window.addEventListener('focus', onWake);

render();
requestWakeLock();
// 每秒检查一次，但只有分钟/日期变了才重绘，避免无谓黑闪
setInterval(render, 1000);
</script>
</body>
</html>
